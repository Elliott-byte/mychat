<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>MyChat · AI 试用台</title>
<style>
  :root {
    --bg: #0f1117;
    --sidebar: #12141c;
    --panel: #171a23;
    --panel2: #1e2230;
    --border: #2a2f3f;
    --text: #e8eaf0;
    --muted: #8b91a5;
    --accent: #6c8cff;
    --accent-hover: #8aa2ff;
    --red: #f87171;
    --radius: 12px;
    --sidebar-w: 268px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  button { font-family: inherit; cursor: pointer; color: inherit; }
  input, textarea, select { font-family: inherit; color: var(--text); }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #333a4d; border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ---------- 登录 ---------- */
  #login-view { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    padding: 40px 36px; width: 100%; max-width: 380px; text-align: center;
  }
  .login-card h1 { font-size: 22px; margin-bottom: 6px; }
  .login-card p { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .login-card input {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--panel2); font-size: 15px; outline: none; margin-bottom: 14px;
  }
  .login-card input:focus { border-color: var(--accent); }
  .login-card button {
    width: 100%; padding: 12px; border-radius: 10px; border: none;
    background: var(--accent); color: #fff; font-size: 15px; font-weight: 600;
  }
  .login-card button:hover { background: var(--accent-hover); }
  .login-error { color: var(--red); font-size: 13px; margin-top: 12px; min-height: 18px; }
  .setup-warn {
    display: none; text-align: left; font-size: 12.5px; line-height: 1.6; margin-bottom: 16px;
    padding: 12px 14px; border-radius: 10px; background: rgba(248,113,113,.1);
    border: 1px solid rgba(248,113,113,.35); color: #fca5a5;
  }
  .setup-warn.show { display: block; }
  .setup-warn b { color: #fecaca; }

  /* ---------- 布局 ---------- */
  #app-view { flex: 1; display: none; min-height: 0; }
  #app-view.show { display: flex; }

  /* ---------- 侧边栏 ---------- */
  #sidebar {
    width: var(--sidebar-w); flex-shrink: 0; background: var(--sidebar);
    border-right: 1px solid var(--border); display: flex; flex-direction: column;
    transition: margin-left .2s ease;
  }
  .sb-top { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .new-chat {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 11px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--panel2); font-size: 14px; font-weight: 500;
  }
  .new-chat:hover { border-color: var(--accent); background: #232838; }
  .mode-tabs { display: flex; gap: 4px; background: var(--panel2); border-radius: 10px; padding: 3px; }
  .mode-tabs button {
    flex: 1; padding: 7px 0; border: none; background: transparent; color: var(--muted);
    border-radius: 8px; font-size: 13.5px;
  }
  .mode-tabs button.active { background: var(--accent); color: #fff; }
  .sb-label {
    padding: 6px 16px; font-size: 11px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .5px; display: flex; justify-content: space-between; align-items: center;
  }
  .sb-label button { background: none; border: none; color: var(--muted); font-size: 11px; padding: 2px 4px; }
  .sb-label button:hover { color: var(--red); }
  #conv-list { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
  .conv {
    display: flex; align-items: center; gap: 6px; padding: 9px 10px; border-radius: 8px;
    font-size: 13.5px; color: var(--text); cursor: pointer; margin-bottom: 2px;
  }
  .conv:hover { background: var(--panel2); }
  .conv.active { background: #262c3d; }
  .conv .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv .acts { display: none; gap: 2px; }
  .conv:hover .acts, .conv.active .acts { display: flex; }
  .conv .acts button {
    background: none; border: none; color: var(--muted); font-size: 12px;
    padding: 3px 4px; border-radius: 4px; line-height: 1;
  }
  .conv .acts button:hover { color: var(--text); background: #333a4d; }
  .conv-empty { padding: 16px; font-size: 12.5px; color: var(--muted); text-align: center; line-height: 1.7; }
  .sb-bottom { border-top: 1px solid var(--border); padding: 10px 12px; display: flex; gap: 8px; }
  .sb-bottom button {
    flex: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--border);
    background: transparent; color: var(--muted); font-size: 12.5px;
  }
  .sb-bottom button:hover { color: var(--text); border-color: var(--accent); }

  /* ---------- 主区 ---------- */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  header {
    display: flex; align-items: center; gap: 10px; padding: 10px 16px;
    border-bottom: 1px solid var(--border); background: var(--panel); flex-wrap: wrap;
  }
  #menu-btn { display: none; background: none; border: none; font-size: 20px; padding: 0 4px; }
  select {
    background: var(--panel2); border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 10px; font-size: 13px; max-width: 300px; outline: none; flex-shrink: 1; min-width: 0;
  }
  #model-search {
    background: var(--panel2); border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 10px; font-size: 13px; width: 120px; outline: none;
  }
  .small-btn {
    background: var(--panel2); border: 1px solid var(--border); color: var(--muted);
    border-radius: 8px; padding: 7px 12px; font-size: 13px; white-space: nowrap;
  }
  .small-btn:hover { color: var(--text); border-color: var(--accent); }
  label.chk { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--muted); cursor: pointer; white-space: nowrap; }
  #model-info { font-size: 12px; color: var(--muted); width: 100%; }

  .pane { flex: 1; display: none; flex-direction: column; min-height: 0; }
  .pane.active { display: flex; }

  /* ---------- 聊天 ---------- */
  #chat-log { flex: 1; overflow-y: auto; padding: 24px 20px; }
  .inner { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
  .msg { display: flex; gap: 13px; }
  .avatar {
    width: 28px; height: 28px; border-radius: 6px; flex-shrink: 0; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
  }
  .msg.user .avatar { background: var(--accent); }
  .msg.assistant .avatar { background: #2d3348; border: 1px solid var(--border); }
  .msg .body { flex: 1; min-width: 0; }
  .msg .who { font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .bubble { font-size: 15px; line-height: 1.72; word-break: break-word; }
  .bubble p { margin: 0 0 10px; white-space: pre-wrap; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble code { background: rgba(0,0,0,.4); padding: 2px 6px; border-radius: 4px; font-size: 13.5px; }
  .bubble pre {
    background: #0b0d13; border: 1px solid var(--border); padding: 12px 14px; border-radius: 8px;
    overflow-x: auto; margin: 10px 0; font-size: 13px; white-space: pre; position: relative;
  }
  .bubble pre code { background: none; padding: 0; }
  .copy-code {
    position: absolute; top: 6px; right: 6px; background: var(--panel2); border: 1px solid var(--border);
    color: var(--muted); font-size: 11px; padding: 3px 8px; border-radius: 5px; opacity: 0;
    transition: opacity .15s;
  }
  .bubble pre:hover .copy-code { opacity: 1; }
  .copy-code:hover { color: var(--text); }
  .msg-acts { display: flex; gap: 6px; margin-top: 8px; opacity: 0; transition: opacity .15s; }
  .msg:hover .msg-acts { opacity: 1; }
  .msg-acts button {
    background: none; border: 1px solid transparent; color: var(--muted);
    font-size: 12px; padding: 3px 8px; border-radius: 6px;
  }
  .msg-acts button:hover { background: var(--panel2); border-color: var(--border); color: var(--text); }
  .cursor::after {
    content: "▊"; animation: blink 1s steps(2) infinite; color: var(--accent); margin-left: 1px;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .empty-state { text-align: center; color: var(--muted); padding: 70px 20px; }
  .empty-state h2 { font-size: 24px; color: var(--text); margin-bottom: 10px; font-weight: 600; }
  .empty-state p { font-size: 14px; line-height: 1.8; }

  .input-wrap { padding: 12px 20px 20px; }
  .input-bar {
    max-width: 800px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end;
    background: var(--panel2); border: 1px solid var(--border); border-radius: 14px; padding: 8px 8px 8px 14px;
  }
  .input-bar:focus-within { border-color: var(--accent); }
  .input-bar textarea {
    flex: 1; background: none; border: none; font-size: 15px; resize: none; outline: none;
    line-height: 1.6; padding: 8px 0; max-height: 200px; overflow-y: auto;
  }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 9px; border: none; background: var(--accent);
    color: #fff; font-size: 16px; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--accent-hover); }
  .icon-btn:disabled { opacity: .35; cursor: not-allowed; }
  .icon-btn.stop { background: var(--red); }
  .hint { max-width: 800px; margin: 8px auto 0; font-size: 11.5px; color: var(--muted); text-align: center; }

  /* ---------- 图片 ---------- */
  #image-pane .wrap { max-width: 800px; width: 100%; margin: 0 auto; padding: 24px 20px; overflow-y: auto; flex: 1; }
  #image-pane textarea {
    width: 100%; background: var(--panel2); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 14px; font-size: 14.5px; resize: vertical; min-height: 90px; outline: none;
  }
  #image-pane textarea:focus { border-color: var(--accent); }
  .img-controls { display: flex; gap: 10px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
  .btn-primary {
    background: var(--accent); border: none; color: #fff; border-radius: 10px;
    padding: 10px 22px; font-size: 14.5px; font-weight: 600;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
  #img-results { margin-top: 20px; display: flex; flex-direction: column; gap: 16px; }
  .img-item { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
  .img-item .prompt-text { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .img-item img { max-width: 100%; border-radius: 8px; display: block; }
  .img-item .actions { margin-top: 10px; display: flex; gap: 8px; }
  .img-item .note { font-size: 13px; margin-top: 8px; white-space: pre-wrap; }
  #img-attach-preview { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  #img-attach-preview img { height: 64px; border-radius: 6px; border: 1px solid var(--border); }
  .loading { color: var(--muted); font-size: 13px; }
  .error-text { color: var(--red); font-size: 13.5px; }

  #overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 5;
  }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 10px; font-size: 13.5px; z-index: 50;
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 820px) {
    #sidebar {
      position: fixed; top: 0; bottom: 0; left: 0; z-index: 10; margin-left: calc(-1 * var(--sidebar-w));
    }
    #sidebar.open { margin-left: 0; }
    #overlay.show { display: block; }
    #menu-btn { display: block; }
    select { max-width: 150px; }
    #model-search { width: 90px; }
  }
</style>
</head>
<body>

<!-- 登录页 -->
<div id="login-view">
  <form class="login-card" id="login-form">
    <h1>🔐 MyChat</h1>
    <p>私人 AI 试用台 · 请输入主密码</p>
    <div class="setup-warn" id="setup-warn"></div>
    <input type="password" id="password" placeholder="主密码" autocomplete="current-password" autofocus>
    <button type="submit">进入</button>
    <div class="login-error" id="login-error"></div>
  </form>
</div>

<!-- 主界面 -->
<div id="app-view">
  <div id="overlay"></div>

  <aside id="sidebar">
    <div class="sb-top">
      <button class="new-chat" id="new-chat">＋ 新对话</button>
      <div class="mode-tabs">
        <button id="tab-chat" class="active">💬 对话</button>
        <button id="tab-image">🎨 图片</button>
      </div>
    </div>
    <div class="sb-label">
      <span>历史记录</span>
      <button id="clear-all" title="删除全部历史">清空</button>
    </div>
    <div id="conv-list"></div>
    <div class="sb-bottom">
      <button id="refresh-models">⟳ 刷新模型</button>
      <button id="logout">退出登录</button>
    </div>
  </aside>

  <div id="main">
    <header>
      <button id="menu-btn">☰</button>
      <input id="model-search" placeholder="搜索模型…">
      <label class="chk"><input type="checkbox" id="free-only"> 只看免费</label>
      <select id="model-select"></select>
      <div id="model-info"></div>
    </header>

    <!-- 聊天 -->
    <div class="pane active" id="chat-pane">
      <div id="chat-log"><div class="inner" id="chat-inner"></div></div>
      <div class="input-wrap">
        <div class="input-bar">
          <textarea id="chat-input" rows="1" placeholder="给 AI 发消息…"></textarea>
          <button class="icon-btn" id="chat-send" title="发送">↑</button>
        </div>
        <div class="hint">Enter 发送 · Shift+Enter 换行 · 历史自动保存</div>
      </div>
    </div>

    <!-- 图片 -->
    <div class="pane" id="image-pane">
      <div class="wrap">
        <textarea id="img-prompt" placeholder="描述你想生成的图片…(左侧切到图片模式后,模型列表已自动筛选为支持出图的模型)"></textarea>
        <div class="img-controls">
          <button class="btn-primary" id="img-send">生成图片</button>
          <label class="small-btn" style="display:inline-block;">
            📎 参考图(图生图)
            <input type="file" id="img-file" accept="image/*" multiple hidden>
          </label>
          <span class="loading" id="img-status"></span>
        </div>
        <div id="img-attach-preview"></div>
        <div id="img-results"></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
let allModels = { chat: [], image: [] };
let mode = "chat";
let messages = [];          // 当前对话的消息
let conversations = [];
let currentConvId = null;
let historyEnabled = false; // 后端是否绑定了 D1
let attachedImages = [];
let controller = null;      // 用于「停止生成」
let autoScroll = true;

/* ---------- 通用 ---------- */
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove("show"), 1800);
}
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

/* ---------- 登录 ---------- */
async function checkAuth() {
  const r = await fetch("/api/me");
  if (r.ok) {
    const d = await r.json().catch(() => ({}));
    historyEnabled = Boolean(d.history);
    showApp();
    return;
  }
  checkSetup();
}
async function checkSetup() {
  try {
    const s = await (await fetch("/api/setup")).json();
    const missing = [];
    if (!s.hasPassword) missing.push("MASTER_PASSWORD");
    if (!s.hasApiKey) missing.push("OPENROUTER_API_KEY");
    if (!missing.length) return;
    $("setup-warn").innerHTML =
      `⚠️ <b>部署尚未完成</b><br>缺少密钥:<b>${missing.join("、")}</b><br>` +
      `请到 Cloudflare 控制台 → Workers &amp; Pages → mychat → Settings → ` +
      `Variables and Secrets 添加(类型选 Secret),然后重新部署。`;
    $("setup-warn").classList.add("show");
  } catch {}
}
$("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("login-error").textContent = "";
  const r = await fetch("/api/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ password: $("password").value }),
  });
  if (r.ok) { await checkAuth(); }
  else {
    const d = await r.json().catch(() => ({}));
    $("login-error").textContent = d.error || "登录失败";
  }
});
$("logout").addEventListener("click", async () => {
  await fetch("/api/logout", { method: "POST" });
  location.reload();
});
function showApp() {
  $("login-view").style.display = "none";
  $("app-view").classList.add("show");
  loadModels();
  loadConversations();
  renderMessages();
}

/* ---------- 侧边栏开关(移动端) ---------- */
function toggleSidebar(open) {
  $("sidebar").classList.toggle("open", open);
  $("overlay").classList.toggle("show", open);
}
$("menu-btn").addEventListener("click", () => toggleSidebar(!$("sidebar").classList.contains("open")));
$("overlay").addEventListener("click", () => toggleSidebar(false));

/* ---------- 模型 ---------- */
async function loadModels() {
  $("model-info").textContent = "正在加载模型列表…";
  try {
    const r = await fetch("/api/models");
    if (!r.ok) throw new Error((await r.json()).error || r.status);
    allModels = await r.json();
    renderModelSelect();
  } catch (err) {
    $("model-info").textContent = "模型列表加载失败:" + err.message;
  }
}
const currentList = () => (mode === "chat" ? allModels.chat : allModels.image) || [];
function isFree(m) {
  return m.id.endsWith(":free") || (m.promptPrice === 0 && m.completionPrice === 0 && m.imagePrice === 0);
}
function renderModelSelect() {
  const sel = $("model-select");
  const search = $("model-search").value.trim().toLowerCase();
  const prev = sel.value;
  let list = currentList();
  if ($("free-only").checked) list = list.filter(isFree);
  if (search) list = list.filter((m) => (m.id + " " + m.name).toLowerCase().includes(search));
  sel.innerHTML = "";
  for (const m of list.slice(0, 300)) {
    const opt = document.createElement("option");
    opt.value = m.id;
    opt.textContent = (isFree(m) ? "🆓 " : "") + m.name;
    sel.appendChild(opt);
  }
  if (prev && list.some((m) => m.id === prev)) sel.value = prev;
  updateModelInfo();
}
function updateModelInfo() {
  const m = currentList().find((x) => x.id === $("model-select").value);
  if (!m) { $("model-info").textContent = "无匹配模型"; return; }
  const price = isFree(m)
    ? "免费"
    : `输入 $${(m.promptPrice * 1e6).toFixed(2)}/M · 输出 $${(m.completionPrice * 1e6).toFixed(2)}/M`;
  const date = m.created ? new Date(m.created * 1000).toISOString().slice(0, 10) : "?";
  const ctx = m.context ? (m.context / 1000).toFixed(0) + "K" : "?";
  $("model-info").textContent = `${m.id} · 上线 ${date} · 上下文 ${ctx} · ${price}`;
}
$("model-search").addEventListener("input", renderModelSelect);
$("free-only").addEventListener("change", renderModelSelect);
$("model-select").addEventListener("change", updateModelInfo);
$("refresh-models").addEventListener("click", () => { loadModels(); toast("正在刷新模型列表…"); });

/* ---------- 模式切换 ---------- */
function setMode(m) {
  mode = m;
  $("tab-chat").classList.toggle("active", m === "chat");
  $("tab-image").classList.toggle("active", m === "image");
  $("chat-pane").classList.toggle("active", m === "chat");
  $("image-pane").classList.toggle("active", m === "image");
  renderModelSelect();
  toggleSidebar(false);
}
$("tab-chat").addEventListener("click", () => setMode("chat"));
$("tab-image").addEventListener("click", () => setMode("image"));

/* ---------- 历史记录 ---------- */
async function loadConversations() {
  if (!historyEnabled) {
    $("conv-list").innerHTML =
      `<div class="conv-empty">未绑定 D1 数据库,<br>本次对话不会被保存。</div>`;
    return;
  }
  try {
    const r = await fetch("/api/conversations");
    if (!r.ok) throw new Error();
    conversations = (await r.json()).conversations || [];
    renderConvList();
  } catch {
    $("conv-list").innerHTML = `<div class="conv-empty">历史加载失败</div>`;
  }
}
function renderConvList() {
  const box = $("conv-list");
  if (!conversations.length) {
    box.innerHTML = `<div class="conv-empty">还没有历史对话<br>发一条消息试试</div>`;
    return;
  }
  box.innerHTML = "";
  for (const c of conversations) {
    const div = document.createElement("div");
    div.className = "conv" + (c.id === currentConvId ? " active" : "");
    div.innerHTML =
      `<span class="t"></span>` +
      `<span class="acts"><button data-act="rename" title="重命名">✎</button>` +
      `<button data-act="delete" title="删除">🗑</button></span>`;
    div.querySelector(".t").textContent = c.title;
    div.title = c.title;
    div.addEventListener("click", (e) => {
      const act = e.target.dataset?.act;
      if (act === "rename") { e.stopPropagation(); renameConv(c); return; }
      if (act === "delete") { e.stopPropagation(); deleteConv(c); return; }
      openConv(c.id);
    });
    box.appendChild(div);
  }
}
async function openConv(id) {
  if (controller) return toast("请先停止当前生成");
  try {
    const r = await fetch("/api/conversations/" + encodeURIComponent(id));
    if (!r.ok) throw new Error();
    const d = await r.json();
    currentConvId = id;
    messages = (d.messages || []).map((m) => ({ role: m.role, content: m.content }));
    if (d.conversation?.model) {
      const opt = [...$("model-select").options].find((o) => o.value === d.conversation.model);
      if (opt) $("model-select").value = d.conversation.model;
      updateModelInfo();
    }
    renderMessages();
    renderConvList();
    toggleSidebar(false);
  } catch { toast("打开对话失败"); }
}
async function renameConv(c) {
  const title = prompt("重命名对话:", c.title);
  if (title === null || !title.trim()) return;
  await fetch("/api/conversations/" + encodeURIComponent(c.id), {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ title }),
  });
  c.title = title.trim();
  renderConvList();
}
async function deleteConv(c) {
  if (!confirm(`删除对话「${c.title}」?此操作不可恢复。`)) return;
  await fetch("/api/conversations/" + encodeURIComponent(c.id), { method: "DELETE" });
  conversations = conversations.filter((x) => x.id !== c.id);
  if (currentConvId === c.id) newChat();
  renderConvList();
  toast("已删除");
}
$("clear-all").addEventListener("click", async () => {
  if (!historyEnabled || !conversations.length) return;
  if (!confirm(`确定删除全部 ${conversations.length} 条历史对话?此操作不可恢复。`)) return;
  await fetch("/api/conversations", { method: "DELETE" });
  conversations = [];
  newChat();
  renderConvList();
  toast("历史已清空");
});
function newChat() {
  currentConvId = null;
  messages = [];
  renderMessages();
  renderConvList();
  $("chat-input").focus();
}
$("new-chat").addEventListener("click", () => { newChat(); setMode("chat"); });

/* ---------- Markdown ---------- */
function renderMarkdown(text) {
  const blocks = [];
  let s = esc(text);
  s = s.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    blocks.push(code.replace(/\n$/, ""));
    return `␀BLOCK${blocks.length - 1}␀`;
  });
  s = s.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  s = s.split(/\n{2,}/).map((p) => `<p>${p}</p>`).join("");
  s = s.replace(/␀BLOCK(\d+)␀/g, (_, i) =>
    `<pre><button class="copy-code">复制</button><code>${blocks[i]}</code></pre>`
  );
  return s;
}
// 代码块复制(事件委托)
$("chat-log").addEventListener("click", (e) => {
  if (!e.target.classList.contains("copy-code")) return;
  const code = e.target.parentElement.querySelector("code");
  navigator.clipboard.writeText(code.textContent).then(() => toast("代码已复制"));
});

/* ---------- 渲染消息 ---------- */
function renderMessages() {
  const box = $("chat-inner");
  if (!messages.length) {
    box.innerHTML =
      `<div class="empty-state"><h2>MyChat</h2>` +
      `<p>选一个模型,开始对话。<br>模型列表每小时自动更新,最新的排在最前面。</p></div>`;
    return;
  }
  box.innerHTML = "";
  messages.forEach((m, i) => box.appendChild(buildMsg(m.role, m.content, i)));
}
function buildMsg(role, content, index) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.innerHTML =
    `<div class="avatar">${role === "user" ? "🧑" : "🤖"}</div>` +
    `<div class="body"><div class="who"></div><div class="bubble"></div>` +
    `<div class="msg-acts"><button data-act="copy">📋 复制</button>` +
    (role === "assistant" ? `<button data-act="regen">↻ 重新生成</button>` : "") +
    `</div></div>`;
  div.querySelector(".who").textContent = role === "user" ? "我" : $("model-select").value || "AI";
  div.querySelector(".bubble").innerHTML = renderMarkdown(content);
  div.querySelector(".msg-acts").addEventListener("click", (e) => {
    const act = e.target.dataset.act;
    if (act === "copy") navigator.clipboard.writeText(content).then(() => toast("已复制"));
    if (act === "regen") regenerate(index);
  });
  return div;
}
function scrollBottom(force) {
  const log = $("chat-log");
  if (force || autoScroll) log.scrollTop = log.scrollHeight;
}
$("chat-log").addEventListener("scroll", () => {
  const log = $("chat-log");
  autoScroll = log.scrollHeight - log.scrollTop - log.clientHeight < 80;
});

/* ---------- 发送 / 流式接收 ---------- */
function setSending(on) {
  const btn = $("chat-send");
  btn.classList.toggle("stop", on);
  btn.textContent = on ? "■" : "↑";
  btn.title = on ? "停止生成" : "发送";
}
async function sendChat(overrideMessages) {
  if (controller) { controller.abort(); return; }
  const model = $("model-select").value;
  if (!model) return toast("请先选择模型");

  let payload;
  if (overrideMessages) {
    payload = overrideMessages;
  } else {
    const text = $("chat-input").value.trim();
    if (!text) return;
    $("chat-input").value = "";
    autoGrow();
    messages.push({ role: "user", content: text });
    payload = messages;
  }

  if (messages.length === 1) $("chat-inner").innerHTML = "";
  if (!overrideMessages) {
    $("chat-inner").appendChild(buildMsg("user", messages[messages.length - 1].content, messages.length - 1));
  }
  autoScroll = true;
  scrollBottom(true);

  // 助手占位气泡
  const holder = buildMsg("assistant", "", messages.length);
  const bubble = holder.querySelector(".bubble");
  bubble.classList.add("cursor");
  holder.querySelector(".msg-acts").style.display = "none";
  $("chat-inner").appendChild(holder);
  scrollBottom();

  controller = new AbortController();
  setSending(true);
  let full = "";
  try {
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model, messages: payload, conversationId: currentConvId }),
      signal: controller.signal,
    });
    if (!r.ok) throw new Error((await r.json()).error || "请求失败 " + r.status);

    const newId = r.headers.get("X-Conversation-Id");
    const isNew = r.headers.get("X-Conversation-New") === "1";
    if (newId) currentConvId = newId;

    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop() || "";
      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        const p = line.slice(6).trim();
        if (!p || p === "[DONE]") continue;
        let j;
        try { j = JSON.parse(p); } catch { continue; }
        if (j.error) throw new Error(j.error.message || "上游返回错误");
        const delta = j.choices?.[0]?.delta?.content;
        if (delta) {
          full += delta;
          bubble.innerHTML = renderMarkdown(full);
          scrollBottom();
        }
      }
    }
    if (!full) full = "(模型返回了空响应)";
    messages.push({ role: "assistant", content: full });
    if (isNew) loadConversations(); else touchConv();
  } catch (err) {
    if (err.name === "AbortError") {
      if (full) { messages.push({ role: "assistant", content: full }); toast("已停止生成"); }
      else { bubble.innerHTML = `<span class="error-text">已取消</span>`; }
    } else {
      bubble.innerHTML = `<span class="error-text">⚠️ ${esc(err.message || err)}</span>`;
      if (!overrideMessages) messages.pop(); // 回滚这条用户消息,便于重试
    }
  } finally {
    controller = null;
    setSending(false);
    bubble.classList.remove("cursor");
    holder.querySelector(".msg-acts").style.display = "";
    if (full) renderMessages(), scrollBottom();
  }
}
// 本地把当前对话挪到列表最前,避免为了排序再请求一次
function touchConv() {
  const i = conversations.findIndex((c) => c.id === currentConvId);
  if (i > 0) { conversations.unshift(conversations.splice(i, 1)[0]); renderConvList(); }
}
function regenerate(index) {
  if (controller) return toast("正在生成中");
  messages = messages.slice(0, index); // 丢掉这条助手回复及其之后的内容
  renderMessages();
  sendChat(messages);
}
$("chat-send").addEventListener("click", () => sendChat());
$("chat-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChat(); }
});
function autoGrow() {
  const t = $("chat-input");
  t.style.height = "auto";
  t.style.height = Math.min(t.scrollHeight, 200) + "px";
}
$("chat-input").addEventListener("input", autoGrow);

/* ---------- 图片生成 ---------- */
$("img-file").addEventListener("change", async (e) => {
  attachedImages = [];
  $("img-attach-preview").innerHTML = "";
  for (const file of e.target.files) {
    const dataUrl = await new Promise((res) => {
      const fr = new FileReader();
      fr.onload = () => res(fr.result);
      fr.readAsDataURL(file);
    });
    attachedImages.push(dataUrl);
    const img = document.createElement("img");
    img.src = dataUrl;
    $("img-attach-preview").appendChild(img);
  }
});
$("img-send").addEventListener("click", async () => {
  const prompt = $("img-prompt").value.trim();
  const model = $("model-select").value;
  if (!prompt || !model) return toast("请填写提示词并选择模型");
  $("img-send").disabled = true;
  $("img-status").textContent = "生成中,请稍候…";
  try {
    const r = await fetch("/api/image", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model, prompt, images: attachedImages }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "生成失败");
    const item = document.createElement("div");
    item.className = "img-item";
    const head = document.createElement("div");
    head.className = "prompt-text";
    head.textContent = `「${prompt}」 · ${model}`;
    item.appendChild(head);
    if (!d.images.length && !d.text) {
      const e2 = document.createElement("div");
      e2.className = "error-text";
      e2.textContent = "模型没有返回图片,换一个支持出图的模型试试。";
      item.appendChild(e2);
    }
    d.images.forEach((url, i) => {
      const img = document.createElement("img");
      img.src = url;
      item.appendChild(img);
      const a = document.createElement("a");
      a.href = url;
      a.download = `mychat-${Date.now()}-${i}.png`;
      a.textContent = "⬇ 下载";
      a.className = "small-btn";
      a.style.textDecoration = "none";
      const actions = document.createElement("div");
      actions.className = "actions";
      actions.appendChild(a);
      item.appendChild(actions);
    });
    if (d.text) {
      const note = document.createElement("div");
      note.className = "note";
      note.textContent = d.text;
      item.appendChild(note);
    }
    $("img-results").prepend(item);
  } catch (err) {
    const item = document.createElement("div");
    item.className = "img-item";
    const e2 = document.createElement("div");
    e2.className = "error-text";
    e2.textContent = "⚠️ " + (err.message || err);
    item.appendChild(e2);
    $("img-results").prepend(item);
  } finally {
    $("img-send").disabled = false;
    $("img-status").textContent = "";
  }
});

checkAuth();
</script>
